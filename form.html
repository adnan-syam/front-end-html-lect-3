<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انشاء مساق</title>
</head>
<body>
    <h1>انشاء مساق</h1>
    <form action="">
        <label for="name">اسم المساق *</label>
        <input type="text" name="" required id="name">
        <br>
        <label for="selc"> نوع المساق *</label>
        <select id="selc">
            <option value="">web dev</option>
            <option value="">mobail dev</option>
            <option value="">ux ui</option>
        </select>
        <br>
        <label>المستوى: </label>
        <label for="low">مبتدئ</label>
        <input type="radio" name="level" id="low">
        <label for="med">متوسط</label>
        <input type="radio" name="level" id="med">
        <label for="good">جيد</label>
        <input type="radio" name="level" id="good">
        <br>
        <label for="num">عدد الطلاب</label>
        <input type="number" name="" id="num">
        <br>
        <label for="mun"> سعر ساعت المساق</label>
        <input type="number" name="" id="mun">
        <br>
        <button type="submit">انشاء</button>
    </form>
</body>
</html>
